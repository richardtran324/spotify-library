<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Library">
<meta name="theme-color" content="#101418">
<title>My Library</title>
<style>
/* Layout: one column for a phone. Sticky top bar (status + search + filters), then a list of covers you tap to play.
   Rows carry small icon buttons on the right (save, queue, open). A Now Playing bar sits at the bottom while something plays. */
:root {
  --bg: #f4f5f2;
  --surface: #ffffff;
  --fg: #15191c;
  --muted: #5d6870;
  --line: #d9ddd8;
  --accent: #1f7a4d;
  --accent-fg: #ffffff;
  --warn: #9a5b00;
  --chip: #e8ebe6;
  --scrim: rgba(10, 14, 18, 0.45);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101418;
    --surface: #182027;
    --fg: #e7ecef;
    --muted: #96a3ad;
    --line: #26313a;
    --accent: #4cc38a;
    --accent-fg: #08140e;
    --warn: #e0a54a;
    --chip: #202a32;
    --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101418;
  --surface: #182027;
  --fg: #e7ecef;
  --muted: #96a3ad;
  --line: #26313a;
  --accent: #4cc38a;
  --accent-fg: #08140e;
  --warn: #e0a54a;
  --chip: #202a32;
  --scrim: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.4;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}
body.has-player { padding-bottom: calc(132px + env(safe-area-inset-bottom, 0px)); }
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg);
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
header.top.detail .search, header.top.detail .filters { display: none; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
.status {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.85rem; color: var(--muted); margin-top: 6px;
  min-height: 1.2em;
}
.stext { min-width: 0; }
.linkbtn {
  font: inherit; font-weight: 600; color: var(--accent); background: none; border: 0;
  padding: 10px 2px; margin: -10px 0; cursor: pointer; text-align: left; border-radius: 6px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--accent); }
.dot.off { background: var(--warn); }
.search {
  width: 100%; margin-top: 10px;
  font: inherit; font-size: 16px;
  padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.filters { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 0.9rem; font-weight: 600;
  padding: 6px 13px; border-radius: 999px; border: 0;
  background: var(--chip); color: var(--fg); cursor: pointer; min-height: 36px;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.iconbtn {
  font: inherit; font-size: 0.85rem; background: none; border: 1px solid var(--line);
  color: var(--muted); border-radius: 8px; padding: 6px 10px; cursor: pointer;
}
.banner {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  margin-top: 10px; padding: 10px 12px; border-radius: 10px;
  background: var(--chip); font-size: 0.9rem;
}
ul.list { list-style: none; margin: 8px 0 0; padding: 0; }
ul.list li { border-bottom: 1px solid var(--line); }
li.row { display: flex; align-items: center; gap: 4px; }
a.item {
  display: flex; align-items: center; gap: 12px; flex: 1;
  padding: 10px 2px; color: inherit; text-decoration: none; min-width: 0;
}
a.item:active { opacity: 0.6; }
.acts { display: flex; gap: 2px; flex: none; }
.act {
  width: 40px; height: 40px; flex: none; padding: 0; border: 0; border-radius: 50%;
  display: inline-grid; place-items: center; background: none; color: var(--muted); cursor: pointer;
}
.act svg { width: 22px; height: 22px; display: block; }
.act:active { background: var(--chip); }
@media (hover: hover) { .act:hover { background: var(--chip); } }
.act[aria-pressed="true"] { color: var(--accent); }
.act[disabled] { opacity: 0.5; cursor: default; }
.cover {
  width: 56px; height: 56px; border-radius: 6px; flex: none;
  background: var(--chip); object-fit: cover;
}
.cover.liked {
  display: grid; place-items: center;
  background: linear-gradient(135deg, #4a3fbf, #8fb3e8); color: #fff; font-size: 26px;
}
.cover.num {
  background: none; display: grid; place-items: center; color: var(--muted);
  font-size: 0.9rem; font-variant-numeric: tabular-nums;
}
ul.list.compact .cover { width: 44px; height: 44px; }
ul.list.compact .cover.num { width: 28px; }
.meta { min-width: 0; flex: 1; }
.name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 0.85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--muted); padding: 24px 2px; }
.sect {
  font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); margin: 18px 2px 2px;
}
.cover.round { border-radius: 50%; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px; margin-top: 16px; display: flex; flex-direction: column; gap: 12px;
}
.card h2 { font-size: 1.15rem; margin: 0; }
.card p { margin: 0; }
.card ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.mono {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.85rem;
  background: var(--chip); border-radius: 6px; padding: 8px 10px; overflow-wrap: anywhere;
  user-select: all; -webkit-user-select: all;
}
.btn {
  font: inherit; font-weight: 600; border: 0; border-radius: 10px;
  padding: 12px 16px; min-height: 44px; cursor: pointer;
  background: var(--accent); color: var(--accent-fg); text-align: center; text-decoration: none;
}
.btn.secondary { background: var(--chip); color: var(--fg); }
.btn.small { padding: 8px 12px; min-height: 40px; font-size: 0.9rem; }
.field {
  width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
}
/* Song list (detail) view */
.dhead { padding-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.back { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; min-height: 40px; }
.back svg { width: 18px; height: 18px; }
.drow { display: flex; gap: 14px; align-items: center; }
.cover.dcover { width: 96px; height: 96px; border-radius: 8px; font-size: 40px; }
.dname { font-size: 1.25rem; margin: 0 0 2px; line-height: 1.25; overflow-wrap: anywhere; }
.dhead .sub { white-space: normal; }
.dbtns { display: flex; gap: 10px; align-items: center; }
.dbtns .btn { flex: 1; min-width: 0; }
.dfoot { padding: 12px 0; display: flex; flex-direction: column; gap: 10px; }
/* Now Playing bar */
.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.pinner {
  max-width: 640px; margin: 0 auto;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));
}
.prow { display: flex; align-items: center; gap: 10px; }
.pcover { width: 44px; height: 44px; border-radius: 4px; background: var(--chip); object-fit: cover; flex: none; }
.pctl { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 2px; }
.act.big { width: 44px; height: 44px; background: var(--fg); color: var(--bg); }
.act.big:active { background: var(--fg); opacity: 0.7; }
@media (hover: hover) { .act.big:hover { background: var(--fg); opacity: 0.85; } }
.topbtns { display: flex; gap: 8px; }
.diagpre {
  margin: 0; max-height: 55vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.78rem; line-height: 1.45;
  background: var(--chip); color: var(--fg); border-radius: 8px; padding: 10px;
  user-select: text; -webkit-user-select: text;
}
/* Device sheet */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet-back { position: absolute; inset: 0; background: var(--scrim); }
.sheet-panel {
  position: relative; width: 100%; max-width: 640px; max-height: 80vh; overflow: auto;
  background: var(--surface); border-radius: 16px 16px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
.sheet-panel h2 { font-size: 1.15rem; margin: 0; }
.devlist { list-style: none; margin: 0; padding: 0; }
.devrow {
  display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px;
  font: inherit; color: inherit; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--line); padding: 12px 4px; min-height: 52px; cursor: pointer;
}
.devrow[aria-current="true"] .devname { color: var(--accent); }
.devrow[disabled] { opacity: 0.55; cursor: default; }
.devname { font-weight: 600; }
.devrow .devname, .devrow > span > .sub { display: block; }
.sheet-btns { display: flex; gap: 10px; }
.sheet-btns .btn { flex: 1; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px;
  font-size: 0.9rem; max-width: calc(100% - 32px); z-index: 30;
  display: flex; gap: 12px; align-items: center;
}
body.has-player .toast { bottom: calc(128px + env(safe-area-inset-bottom, 0px)); }
.toast a { color: var(--bg); font-weight: 700; }
.toastbtn {
  font: inherit; font-weight: 700; color: var(--bg); background: none;
  border: 1px solid currentColor; border-radius: 8px; padding: 6px 12px; min-height: 40px; cursor: pointer; flex: none;
}
.toast .toastbtn:focus-visible { outline-color: var(--bg); }
.err { color: var(--warn); font-size: 0.9rem; }
/* Podcasts */
.cover.eps {
  display: grid; place-items: center;
  background: linear-gradient(135deg, #0d5c46, #3fb27f); color: #fff;
}
.cover.eps svg { width: 46%; height: 46%; display: block; }
/* Auto-wake status line (inside the sticky header) */
.wake { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--fg); margin-top: 6px; }
.wake .stext { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot.pulse { background: var(--accent); animation: pulse 0.9s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .dot.pulse { animation: none; } }
/* Settings in the Diagnostics sheet */
.sheet-sub { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0; }
.setrow { display: flex; align-items: flex-start; gap: 12px; padding: 6px 0 4px; cursor: pointer; min-height: 44px; }
.setrow input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }
.setname { display: block; font-weight: 600; }
.setnote { display: block; font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top" hidden>
    <div class="toprow">
      <h1>Library</h1>
      <span class="topbtns">
        <button class="iconbtn" id="diagBtn" type="button">Diagnostics</button>
        <button class="iconbtn" id="refreshBtn" type="button">Refresh</button>
      </span>
    </div>
    <div class="status" id="status"><span class="dot" id="dot"></span><span class="stext"><span id="statusText">Checking for Spotify on your devices…</span> <button class="linkbtn" id="devBtn" type="button" hidden></button></span></div>
    <div class="wake" id="wake" role="status" hidden><span class="dot pulse"></span><span class="stext" id="wakeText"></span><button class="linkbtn" id="wakeCancel" type="button">Cancel</button></div>
    <input class="search" id="search" type="search" placeholder="Filter by name" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Filter by name">
    <div class="filters" role="group" aria-label="Show">
      <button class="chip" type="button" data-filter="playlists" aria-pressed="true">Playlists</button>
      <button class="chip" type="button" data-filter="albums" aria-pressed="false">Albums</button>
      <button class="chip" type="button" data-filter="artists" aria-pressed="false">Artists</button>
      <button class="chip" type="button" data-filter="podcasts" aria-pressed="false">Podcasts</button>
      <button class="chip" type="button" data-filter="recent" aria-pressed="false">Recent</button>
      <button class="chip" type="button" data-filter="all" aria-pressed="false">All</button>
      <button class="chip" type="button" data-filter="search" aria-pressed="false">Search Spotify</button>
    </div>
  </header>
  <div class="banner" id="banner" role="status" hidden>
    <span>New features need one more sign-in</span>
    <button class="btn small" id="bannerBtn" type="button">Sign in again</button>
  </div>

  <main id="main"></main>
</div>

<div class="player" id="player" hidden>
  <div class="pinner">
    <div class="prow">
      <img class="pcover" id="pCover" alt="">
      <div class="meta"><div class="name" id="pTitle"></div><div class="sub" id="pSub"></div></div>
      <button class="act heart" id="pHeart" type="button" data-uri="" data-name="" data-kind="track" aria-pressed="false" aria-label="Like this song"></button>
    </div>
    <div class="pctl">
      <button class="act" id="pShuffle" type="button" aria-label="Shuffle" aria-pressed="false"></button>
      <button class="act" id="pPrev" type="button" aria-label="Previous"></button>
      <button class="act big" id="pPlay" type="button" aria-label="Pause"></button>
      <button class="act" id="pNext" type="button" aria-label="Next"></button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet-panel">
    <h2 id="sheetTitle">Play on</h2>
    <ul class="devlist" id="devList"></ul>
    <div class="sheet-btns">
      <button class="btn secondary" id="sheetRefresh" type="button">Refresh</button>
      <button class="btn secondary" id="sheetClose" type="button">Close</button>
    </div>
  </div>
</div>

<div class="sheet" id="diag" role="dialog" aria-modal="true" aria-labelledby="diagTitle" hidden>
  <div class="sheet-back" id="diagBack"></div>
  <div class="sheet-panel">
    <h2 id="diagTitle">Diagnostics</h2>
    <h3 class="sheet-sub">Settings</h3>
    <label class="setrow"><input type="checkbox" id="wakeShortcut"><span><span class="setname">Use my Wake Spotify shortcut</span><span class="setnote">When Spotify isn’t open on any device, a tap runs your “Wake Spotify” shortcut instead of opening the item in the Spotify app.</span></span></label>
    <h3 class="sheet-sub">Report</h3>
    <pre class="diagpre" id="diagOut">Checking…</pre>
    <div class="sheet-btns">
      <button class="btn secondary" id="diagCopy" type="button">Copy</button>
      <button class="btn secondary" id="diagRun" type="button">Run again</button>
      <button class="btn secondary" id="diagClose" type="button">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';

  var SCOPE_LIST = [
    'playlist-read-private',
    'playlist-read-collaborative',
    'playlist-modify-public',
    'user-library-read',
    'user-library-modify',
    'user-follow-read',
    'user-read-playback-state',
    'user-modify-playback-state',
    'user-read-recently-played',
    'user-read-playback-position'
  ];
  var SCOPES = SCOPE_LIST.join(' ');
  var API = 'https://api.spotify.com/v1';
  var AUTH = 'https://accounts.spotify.com';
  var K = {
    client: 'lib-client-id',
    token: 'lib-token',        // {access, refresh, expires, scope}
    verifier: 'lib-verifier',
    state: 'lib-state',
    cache: 'lib-cache',        // {at, me, playlists, albums, artists, likedTotal, shows, episodesTotal}
    filter: 'lib-filter',
    device: 'lib-device',      // preferred device id, chosen in the device sheet
    wake: 'lib-wake',          // 'link' (default) or 'shortcut'; stored as a plain string
    pending: 'lib-pending'     // {item, opts, at[, manual]}: a tap waiting for Spotify to wake up
  };
  var FILTERS = ['playlists', 'albums', 'artists', 'podcasts', 'recent', 'all', 'search'];
  var POLL_MS = 10000;
  var FRESH_MS = 90 * 1000;
  var NO_DEVICE_MS = 2 * 60 * 1000;   // how long an empty device list counts as "known: nothing open"
  var WAKE_MAX_MS = 3 * 60 * 1000;    // a pending tap older than this is dropped
  var WAKE_POLL_MS = 1500;
  var WAKE_FOR_MS = 15000;
  var SHORTCUT_URL = 'shortcuts://run-shortcut?name=' + encodeURIComponent('Wake Spotify');
  var NO_DEVICE = 'Spotify needs to be open on a device first: your phone, computer or speaker.';
  var REDIRECT = location.origin + location.pathname.replace(/index\.html$/, '');

  var state = {
    data: null, filter: 'playlists', query: '',
    device: null, deviceAt: 0, deviceChecked: false, devices: [], devicesAt: 0, active: null,
    player: null, pollTimer: null, pollSeq: 0, pollFailed: false,
    search: { q: '', results: null, loading: false, error: '' },
    recent: { items: null, loading: false, error: '' }, recentSeq: 0,
    saved: {}, busy: {}, containsOff: false, checking: {}, checkQueue: [], checkTimer: null,
    detail: null, listScroll: 0, pushed: false,
    started: false, scopeProblem: false,
    sheetLoading: false, sheetError: '', sheetReturn: null,
    wake: { running: false, timer: null, at: 0 }
  };
  var searchTimer = null;
  var searchSeq = 0;
  var refreshing = null;

  // ---------- storage helpers ----------
  function get(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (a) {
      if (attrs[a] == null) return;
      if (a === 'text') n.textContent = attrs[a];
      else if (a === 'class') n.className = attrs[a];
      else n.setAttribute(a, attrs[a]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  // Inline icons (static strings only).
  function svg(inner) { return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + inner + '</svg>'; }
  var HEART_D = 'M12 20.6l-1.3-1.2C6 15.2 3 12.4 3 8.9 3 6.1 5.2 4 7.9 4c1.6 0 3.1.7 4.1 1.9C13 4.7 14.5 4 16.1 4 18.8 4 21 6.1 21 8.9c0 3.5-3 6.3-7.7 10.5L12 20.6z';
  var ICON = {
    heart: svg('<path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="' + HEART_D + '"/>'),
    heartOn: svg('<path fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="' + HEART_D + '"/>'),
    plus: svg('<path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 5v14M5 12h14"/>'),
    open: svg('<path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>'),
    back: svg('<path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/>'),
    prev: svg('<path fill="currentColor" d="M6 6h2v12H6zM9.5 12L18 18V6z"/>'),
    next: svg('<path fill="currentColor" d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/>'),
    play: svg('<path fill="currentColor" d="M8 5v14l11-7z"/>'),
    pause: svg('<path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/>'),
    shuffle: svg('<path fill="currentColor" d="M10.6 9.2L5.4 4 4 5.4l5.2 5.2 1.4-1.4zM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5zm.3 9.4l-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2-3.2-3.1z"/>'),
    bookmark: svg('<path fill="currentColor" d="M6 3h12v18l-6-4.5L6 21z"/>')
  };

    if ((f === 'playlists' || f === 'all') && d.likedTotal != null) items.push(likedItem(d));
    if (f === 'playlists' || f === 'all') items = items.concat(d.playlists || []);
    if (f === 'albums' || f === 'all') items = items.concat(d.albums || []);
    if (f === 'artists' || f === 'all') items = items.concat(d.artists || []);
    if ((f === 'podcasts' || f === 'all') && d.episodesTotal != null) items.push(savedEpisodesItem(d));
    if (f === 'podcasts' || f === 'all') items = items.concat(d.shows || []);
    if (f === 'artists' && !d.artists) {
      main.appendChild(el('p', { class: d.artists === null ? 'err' : 'empty', text: d.artists === null
        ? (missingScopes().length ? 'Followed artists need one more sign-in. Tap “Sign in again” above.' : 'Couldn’t load your followed artists. Tap Refresh to try again.')
        : 'Loading your artists…' }));
      return;
    }
    if (f === 'podcasts' && !d.shows && d.episodesTotal == null) {
      main.appendChild(el('p', { class: d.shows === null ? 'err' : 'empty', text: d.shows === null
        ? 'Couldn’t load your podcasts. Tap Refresh to try again.'
        : 'Loading your podcasts…' }));
      return;
    }
    items = matches(items);
    if (!items.length) { main.appendChild(el('p', { class: 'empty', text: state.query.trim() ? 'Nothing matches “' + state.query + '”.' : (f === 'artists' ? 'You don’t follow any artists yet.' : f === 'podcasts' ? 'You haven’t saved any podcasts yet.' : 'Nothing here yet.') })); return; }
    var ul = el('ul', { class: 'list' });
    items.forEach(function (i) { ul.appendChild(itemRow(i)); });
    main.appendChild(ul);
  }
  function setFilter(f, focus) {
    var wasSearch = state.filter === 'search';
    state.filter = f; set(K.filter, f);
    document.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c.dataset.filter === f)); });
    var box = $('search');
    if (f === 'search') {
      box.placeholder = 'Search all of Spotify';
      box.setAttribute('aria-label', 'Search all of Spotify');
      box.setAttribute('enterkeyhint', 'search');
      if (!wasSearch) { box.value = state.search.q; }
      if (focus) box.focus();
    } else {
      box.placeholder = 'Filter by name';
      box.setAttribute('aria-label', 'Filter by name');
      box.setAttribute('enterkeyhint', 'done');
      if (wasSearch) { box.value = state.query; }
    }
    if (f === 'recent') loadRecent();   // always fresh when chosen
    else renderList();
  }

  // ---------- song list (detail) view ----------
  function canList(p) { return isOwn(p) || p.collaborative; }
  function detailUrl(item) {
    if (item.kind === 'album') return '/albums/' + encodeURIComponent(item.id) + '/tracks?limit=50&offset=0';
    if (item.kind === 'liked') return '/me/tracks?limit=50&offset=0';
    if (item.kind === 'playlist' && canList(item)) return '/playlists/' + encodeURIComponent(item.id) + '/items?limit=50&offset=0';
    if (item.kind === 'show') return '/shows/' + encodeURIComponent(item.id) + '/episodes?limit=50&offset=0';
    if (item.kind === 'episodes') return '/me/episodes?limit=50&offset=0';
    return null;
  }
  function mapDetail(parent, it) {
    if (!it) return null;
    if (parent.kind === 'show') return mapEpisode(it, false);
    if (parent.kind === 'episodes') {
      var ep = mapEpisode(it.episode, true);
      if (ep && state.saved[ep.uri] === undefined) state.saved[ep.uri] = true;
      return ep;
    }
    if (parent.kind === 'album') return mapTrack(it, { num: it.track_number, noImg: true, sub: names(it.artists), ctx: parent.uri });
    if (it.is_local) return null;
    var t = it.item || it.track;
    if (!t) return null;
    var sub = t.type === 'episode' ? ((t.show && t.show.name) || 'Podcast') : names(t.artists) + (t.album && t.album.name ? ' · ' + t.album.name : '');
    var m = mapTrack(t, { sub: sub, ctx: parent.kind === 'liked' ? likedCtx() : parent.uri });
    if (m && parent.kind === 'liked' && state.saved[m.uri] === undefined) state.saved[m.uri] = true;
    return m;
  }
  function openDetail(item) {
    state.listScroll = window.pageYOffset || document.documentElement.scrollTop || 0;
    state.detail = { item: item, items: [], next: null, loading: false, error: '', restricted: false, lastUrl: null };
    try { history.pushState({ detail: true }, '', '#detail'); state.pushed = true; } catch (e) { state.pushed = false; }
    renderDetail();
    window.scrollTo(0, 0);
    if (canSave(item)) requestSaved([item.uri]);
    loadDetail(detailUrl(item));
  }
  function goBack() {
    if (state.pushed && location.hash === '#detail') history.back();   // popstate closes the view
    else closeDetail();
  }
  function closeDetail() {
    if (!state.detail) return;
    state.detail = null;
    state.pushed = false;
    $('top').classList.remove('detail');
    if (location.hash === '#detail') { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    renderList();
    window.scrollTo(0, state.listScroll);
  }
  function renderDetail() {
    var d = state.detail;
    var it = d.item;
    $('top').classList.add('detail');
    var main = $('main');
    main.textContent = '';
    var back = el('button', { class: 'iconbtn back', type: 'button', 'aria-label': 'Back to list' });
    back.innerHTML = ICON.back;
    back.appendChild(el('span', { text: 'Back' }));
    back.addEventListener('click', goBack);
    var playA = el('a', { class: 'btn', href: it.url, text: 'Play' });
    var btns = [playA];
    if (isPod(it)) {
      // No show context to play, so Play starts the newest episode you haven't finished.
      playA.addEventListener('click', function (ev) {
        var t = firstUnplayed(d.items);
        if (!t) { ev.preventDefault(); toast(d.loading ? 'Episodes are still loading.' : 'No episodes to play.'); return; }
        onItemClick(t, ev);
      });
    } else {
      playA.addEventListener('click', function (ev) { onItemClick(it, ev); });
      var shufA = el('a', { class: 'btn secondary', href: it.url, text: 'Shuffle' });
      shufA.addEventListener('click', function (ev) { onItemClick(it, ev, { shuffle: true }); });
      btns.push(shufA);
    }
    if (canSave(it)) btns.push(heartBtn(it));
    main.appendChild(el('section', { class: 'dhead' }, [
      back,
      el('div', { class: 'drow' }, [
        coverFor(it, 'dcover'),
        el('div', { class: 'meta' }, [el('h2', { class: 'dname', text: it.name }), el('div', { class: 'sub', text: it.sub })])
      ]),
      el('div', { class: 'dbtns' }, btns)
    ]));
    main.appendChild(el('ul', { class: 'list compact', id: 'dlist' }));
    main.appendChild(el('div', { class: 'dfoot', id: 'dfoot' }));
    appendDetailRows(d.items);
    paintDetailFoot();
  }
  function firstUnplayed(items) {
    for (var i = 0; i < items.length; i++) { if (!items[i].played) return items[i]; }
    return items[0] || null;
  }
  function appendDetailRows(items) {
    var ul = $('dlist');
    if (!ul) return;
    items.forEach(function (i) { ul.appendChild(itemRow(i)); });
    requestSaved(savableUris(items));
  }
  function paintDetailFoot() {
    var d = state.detail;
    var f = $('dfoot');
    if (!d || !f) return;
    f.textContent = '';
    if (d.restricted) {
      f.appendChild(el('p', { class: 'empty', text: 'Spotify only lets personal apps list songs in your own playlists. Tap Play to hear this one.' }));
      return;
    }
    if (d.error) {
      f.appendChild(el('p', { class: 'err', text: d.error }));
      var retry = el('button', { class: 'btn secondary', type: 'button', text: 'Try again' });
      retry.addEventListener('click', function () { loadDetail(d.lastUrl); });
      f.appendChild(retry);
      return;
    }
    var noun = isPod(d.item) ? 'episodes' : 'songs';
    if (d.loading) { f.appendChild(el('p', { class: 'empty', text: 'Loading ' + noun + '…' })); return; }
    if (d.next) {
      var more = el('button', { class: 'btn secondary', type: 'button', text: 'Load more' });
      more.addEventListener('click', function () { loadDetail(d.next); });
      f.appendChild(more);
    } else if (!d.items.length) {
      f.appendChild(el('p', { class: 'empty', text: 'No ' + noun + ' here.' }));
    }
  }
  function loadDetail(url) {
    var d = state.detail;
    if (!d || d.loading) return;
    if (!url) { d.restricted = true; paintDetailFoot(); return; }
    d.loading = true; d.error = ''; d.lastUrl = url;
    paintDetailFoot();
    api(url).then(function (r) {
      if (state.detail !== d) return;
      d.loading = false;
      if (r.status === 403 && d.item.kind === 'playlist') { d.restricted = true; paintDetailFoot(); return; }
      if (!r.ok || !r.json) throw new Error(errMsg(r));
      var mapped = (r.json.items || []).map(function (it) { return mapDetail(d.item, it); }).filter(Boolean);
      d.items = d.items.concat(mapped);
      d.next = r.json.next || null;
      appendDetailRows(mapped);
      paintDetailFoot();
    }).catch(function (e) {
      if (state.detail !== d) return;
      d.loading = false;
      if (e.message === 'signed-out') return renderSignIn();
      d.error = 'Couldn’t load ' + (isPod(d.item) ? 'episodes' : 'songs') + ' (' + e.message + ').';
      paintDetailFoot();
    });
  }

  // ---------- screens ----------
  function stopApp() {
    state.started = false;
    clearTimeout(state.pollTimer); state.pollTimer = null;
    stopWake();
    state.player = null;
    state.detail = null; state.pushed = false;
    $('top').classList.remove('detail');
    $('top').hidden = true;
    $('banner').hidden = true;
    closeSheet();
    paintPlayer();
  }
  function renderSetup(errMsgText) {
    stopApp();
    var main = $('main'); main.textContent = '';
    var input = el('input', { class: 'field', id: 'clientId', type: 'text', placeholder: 'Paste your Client ID', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Client ID' });
    var save = el('button', { class: 'btn', type: 'button', text: 'Save and sign in with Spotify' });
    var copy = el('button', { class: 'btn secondary', type: 'button', text: 'Copy this address' });
    var addr = el('div', { class: 'mono', id: 'redirect', text: REDIRECT });
    copy.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(REDIRECT).then(function () { toast('Copied'); }, function () { toast('Select the address and copy it'); });
      } else { toast('Select the address and copy it'); }
    });
    save.addEventListener('click', function () {
      var v = input.value.trim();
      if (!/^[0-9a-f]{32}$/i.test(v)) { err.textContent = 'That doesn’t look like a Client ID. It’s 32 letters and numbers, from your app’s Settings page.'; return; }
      set(K.client, v); login();
    });
    var err = el('p', { class: 'err', text: errMsgText || '' });
    main.appendChild(el('section', { class: 'card' }, [
      el('h2', { text: 'One-time setup' }),
      el('p', { text: 'In your Spotify developer app, set the Redirect URI to this exact address:' }),
      addr, copy,
      el('p', { text: 'Then paste the app’s Client ID here. It isn’t a password; it only identifies your app.' }),
      input, save, err
    ]));
  }
  function renderSignIn(msg) {
    stopApp();
    var main = $('main'); main.textContent = '';
    var go = el('button', { class: 'btn', type: 'button', text: 'Sign in with Spotify' });
    go.addEventListener('click', login);
    var reset = el('button', { class: 'btn secondary', type: 'button', text: 'Change Client ID' });
    reset.addEventListener('click', function () { del(K.client); del(K.token); renderSetup(); });
    main.appendChild(el('section', { class: 'card' }, [
      el('h2', { text: 'Sign in' }),
      el('p', { text: 'Sign in once on this phone. You’ll stay signed in until Spotify asks again (about every 6 months).' }),
      msg ? el('p', { class: 'err', text: msg }) : null,
      go, reset
    ]));
  }

  function refresh() {
    return loadData().then(function (d) {
      state.data = d;
      seedSaved(d, true);
      renderList();
      paintHearts();
    }).catch(function (e) {
      if (e.message === 'signed-out') return renderSignIn();
      if (!state.data && !state.detail && state.filter !== 'search' && state.filter !== 'recent') {
        $('main').textContent = ''; $('main').appendChild(el('p', { class: 'err', text: 'Couldn’t load your library: ' + e.message }));
      } else toast('Couldn’t refresh: ' + e.message);
    });
  }
  function startApp() {
    state.started = true;
    $('top').hidden = false;
    var f = get(K.filter);
    state.filter = FILTERS.indexOf(f) !== -1 ? f : 'playlists';
    state.data = get(K.cache);
    seedSaved(state.data, false);
    updateBanner();
    setFilter(state.filter);
    checkDevice();
    refresh();
    schedulePoll(0);
    resumePending(false);
  }

  // ---------- wiring ----------
  $('search').addEventListener('input', function (e) {
    if (state.filter === 'search') scheduleSearch(e.target.value, false);
    else { state.query = e.target.value; renderList(); }
  });
  $('search').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (state.filter === 'search') scheduleSearch(e.target.value, true);
    e.target.blur(); // hides the iPhone keyboard so results are visible
  });
  document.querySelectorAll('.chip').forEach(function (c) { c.addEventListener('click', function () { setFilter(c.dataset.filter, true); }); });
  $('refreshBtn').addEventListener('click', function () { checkDevice(); refresh(); schedulePoll(0); toast('Refreshing…'); });
  $('bannerBtn').addEventListener('click', login);
  $('devBtn').addEventListener('click', openSheet);
  $('sheetClose').addEventListener('click', closeSheet);
  $('sheetBack').addEventListener('click', closeSheet);
  $('sheetRefresh').addEventListener('click', loadSheetDevices);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSheet(); closeDiag(); } });
  $('diagBtn').addEventListener('click', openDiag);
  $('diagClose').addEventListener('click', closeDiag);
  $('diagBack').addEventListener('click', closeDiag);
  $('diagRun').addEventListener('click', runDiag);
  $('diagCopy').addEventListener('click', copyDiag);
  $('wakeShortcut').addEventListener('change', function (e) {
    setWakeMode(e.target.checked ? 'shortcut' : 'link');
    toast(e.target.checked ? 'Taps will run your Wake Spotify shortcut when Spotify isn’t open' : 'Taps will open the item in Spotify when Spotify isn’t open');
  });
  $('wakeCancel').addEventListener('click', function () { del(K.pending); stopWake(); toast('Cancelled'); });
  $('pPrev').innerHTML = ICON.prev;
  $('pNext').innerHTML = ICON.next;
  $('pShuffle').innerHTML = ICON.shuffle;
  $('pPlay').innerHTML = ICON.pause;
  $('pPrev').addEventListener('click', function () { command('POST', '/me/player/previous'); });
  $('pNext').addEventListener('click', function () { command('POST', '/me/player/next'); });
  $('pPlay').addEventListener('click', function () {
    var p = state.player;
    if (p && p.is_playing) command('PUT', '/me/player/pause', function (x) { x.is_playing = false; });
    else command('PUT', '/me/player/play', function (x) { x.is_playing = true; });
  });
  $('pShuffle').addEventListener('click', function () {
    var on = !(state.player && state.player.shuffle_state);
    command('PUT', '/me/player/shuffle?state=' + on, function (x) { x.shuffle_state = on; });
  });
  $('pHeart').addEventListener('click', function () {
    var h = $('pHeart');
    toggleSave(h.getAttribute('data-uri'), h.getAttribute('data-name'), h.getAttribute('data-kind'));
  });
  window.addEventListener('popstate', function () {
    if (location.hash === '#detail') {
      if (!state.detail) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
      return;
    }
    closeDetail();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { clearTimeout(state.pollTimer); state.pollTimer = null; return; }
    if (state.started && get(K.token)) { checkDevice(); schedulePoll(0); resumePending(false); }
  });
  // Coming back with the Back button can restore the page from memory without a visibility change.
  window.addEventListener('pageshow', function (e) {
    if (e.persisted && state.started && get(K.token)) { checkDevice(); schedulePoll(0); resumePending(false); }
  });

  if (location.hash === '#detail') { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  var params = new URLSearchParams(location.search);
  readPending();   // drops a pending tap older than 3 minutes
  if (params.has('wake')) {
    // The Wake Spotify shortcut opens ?wake=1; the pending tap itself is in storage.
    params.delete('wake');
    var qs = params.toString();
    try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch (e) {}
  }
  if (params.has('code') || params.has('error')) {
    handleCallback(params).then(function (ok) { if (ok) startApp(); });
  } else if (!get(K.client)) {
    renderSetup();
  } else if (!get(K.token)) {
    renderSignIn();
  } else {
    startApp();
  }
})();
</script>
</body>
</html>
