<style>
/* Layout: one column for a phone. Sticky top bar (status + search + filters), then a list of covers. A tap opens an album,

   A Now Playing bar sits at the bottom while something plays. */
:root {

  --fg: #15191c;

  --line: #d9ddd8;

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101418;
    --surface: #182027;
    --fg: #e7ecef;
    --muted: #96a3ad;
    --line: #26313a;
    --accent: #4cc38a;
    --accent-fg: #08140e;
    --warn: #e0a54a;
    --chip: #202a32;
    --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101418;
  --surface: #182027;
  --fg: #e7ecef;
  --muted: #96a3ad;
  --line: #26313a;
  --accent: #4cc38a;
  --accent-fg: #08140e;
  --warn: #e0a54a;
  --chip: #202a32;
  --scrim: rgba(0, 0, 0, 0.6);

}

  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.4;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}

.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

.stext { min-width: 0; }
.linkbtn {

}

}

.card {

}
.btn {

}

  width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
}
/* Song list (detail) view */
.dhead { padding-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.back { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; min-height: 40px; }

.cover.dcover { width: 96px; height: 96px; border-radius: 8px; font-size: 40px; }

/* Now Playing bar */
.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.pinner {
  max-width: 640px; margin: 0 auto;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px));
}
.prow { display: flex; align-items: center; gap: 10px; }

.pctl { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 2px; }
.act.big { width: 44px; height: 44px; background: var(--fg); color: var(--bg); }

  background: var(--chip); color: var(--fg); border-radius: 8px; padding: 10px;
  user-select: text; -webkit-user-select: text;

/* Device sheet */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet-back { position: absolute; inset: 0; background: var(--scrim); }
.sheet-panel {
  position: relative; width: 100%; max-width: 640px; max-height: 80vh; overflow: auto;
  background: var(--surface); border-radius: 16px 16px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));

.devlist { list-style: none; margin: 0; padding: 0; }

/* Settings in the Diagnostics sheet */
.sheet-sub { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 4px 0 0; }
.setrow { display: flex; align-items: flex-start; gap: 12px; padding: 6px 0 4px; cursor: pointer; min-height: 44px; }

.npf {

/* Home (v2.10): Liked Songs shortcut, then short sections of your own things, each with an optional "See all" */
ul.list.hero { margin-top: 12px; }
ul.list.hero li { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 4px 0 10px; }
.hero .cover { width: 64px; height: 64px; }
.hero .name { font-size: 1.05rem; }
.shead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 18px 2px 2px; }
.shead .sect { margin: 0; }
.shead .linkbtn { font-size: 0.85rem; }
/* v2.12: Jump back in album and podcast cards open on a tap; the round button on the cover plays */
.cl li { position: relative; }
.cardplay {
  position: absolute; top: 68px; left: 68px; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%;
  display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); cursor: pointer;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
}
.cardplay svg { width: 20px; height: 20px; display: block; }
.cardplay:active { opacity: 0.7; }
.acover { flex: none; display: flex; }   /* artist view: holds the picture, which arrives a moment later */
.cover.round.dcover { border-radius: 50%; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top" hidden>
    <div class="toprow">
      <h1>Library</h1>
      <span class="topbtns">
        <button class="iconbtn" id="diagBtn" type="button">Diagnostics</button>
        <button class="iconbtn" id="refreshBtn" type="button">Refresh</button>
      </span>
    </div>
    <div class="status" id="status"><span class="dot" id="dot"></span><span class="stext"><span id="statusText">Checking for Spotify on your devices…</span> <button class="linkbtn" id="devBtn" type="button" hidden></button></span></div>
    <div class="wake" id="wake" role="status" hidden><span class="dot pulse" id="wakeDot"></span><span class="stext" id="wakeText"></span><span class="wakebtns"><button class="linkbtn" id="wakeRetry" type="button" hidden>Try again</button><button class="linkbtn" id="wakeOpen" type="button" hidden>Open Spotify instead</button><button class="linkbtn" id="wakeCancel" type="button">Cancel</button></span></div>
    <input class="search" id="search" type="search" placeholder="Filter by name" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Filter by name">
    <div class="filters" role="group" aria-label="Show">
      <button class="chip" type="button" data-filter="home" aria-pressed="true">Home</button>
      <button class="chip" type="button" data-filter="playlists" aria-pressed="false">Playlists</button>
      <button class="chip" type="button" data-filter="albums" aria-pressed="false">Albums</button>
      <button class="chip" type="button" data-filter="artists" aria-pressed="false">Artists</button>
      <button class="chip" type="button" data-filter="podcasts" aria-pressed="false">Podcasts</button>
      <button class="chip" type="button" data-filter="recent" aria-pressed="false">Recent</button>
      <button class="chip" type="button" data-filter="all" aria-pressed="false">All</button>
      <button class="chip" type="button" data-filter="search" aria-pressed="false">Search Spotify</button>
    </div>
    <div class="schips" id="schips" role="group" aria-label="Result type" hidden>
      <button class="schip" type="button" data-stype="all" aria-pressed="true">All</button>
      <button class="schip" type="button" data-stype="track" aria-pressed="false">Songs</button>
      <button class="schip" type="button" data-stype="artist" aria-pressed="false">Artists</button>
      <button class="schip" type="button" data-stype="album" aria-pressed="false">Albums</button>
      <button class="schip" type="button" data-stype="playlist" aria-pressed="false">Playlists</button>
      <button class="schip" type="button" data-stype="show" aria-pressed="false">Podcasts</button>
      <button class="schip" type="button" data-stype="episode" aria-pressed="false">Episodes</button>
    </div>
  </header>
  <div class="banner" id="banner" role="status" hidden>
    <span>New features need one more sign-in</span>
    <button class="btn small" id="bannerBtn" type="button">Sign in again</button>
  </div>

  <main id="main"></main>
</div>

<div class="player" id="player" hidden>
  <div class="pinner">
    <div class="prow">
      <button class="pinfo" id="pInfo" type="button" aria-label="Open Now Playing" aria-haspopup="dialog">
        <img class="pcover" id="pCover" alt="">
        <span class="meta"><span class="name" id="pTitle"></span><span class="sub" id="pSub"></span></span>
      </button>
      <button class="act" id="pQueue" type="button" aria-label="Up next" aria-haspopup="dialog"></button>
      <button class="act heart" id="pHeart" type="button" data-uri="" data-name="" data-kind="track" aria-pressed="false" aria-label="Like this song"></button>
    </div>
    <div class="pctl">
      <button class="act" id="pShuffle" type="button" aria-label="Shuffle" aria-pressed="false"></button>
      <button class="act" id="pPrev" type="button" aria-label="Previous"></button>
      <button class="act big" id="pPlay" type="button" aria-label="Pause"></button>
      <button class="act" id="pNext" type="button" aria-label="Next"></button>
      <button class="act" id="pRepeat" type="button" aria-label="Repeat off" aria-pressed="false"></button>
    </div>
  </div>
</div>

<div class="npfull" id="np" role="dialog" aria-modal="true" aria-labelledby="npTitle" hidden>
  <div class="npf" id="npPanel">
    <div class="npf-top">
      <button class="act" id="npClose" type="button" aria-label="Close Now Playing"></button>
      <h2 class="npf-h" id="npTitle">Now playing</h2>
      <button class="act" id="npQueue" type="button" aria-label="Up next" aria-haspopup="dialog"></button>
    </div>
    <img class="npf-cover" id="npCover" alt="">
    <div class="npf-row">
      <div class="meta"><div class="npf-title" id="npName"></div><div class="sub" id="npBy"></div><div class="idleline" id="npIdle" role="status" hidden></div></div>
      <button class="act heart" id="npHeart" type="button" data-uri="" data-name="" data-kind="track" aria-pressed="false" aria-label="Like this song"></button>
    </div>
    <div class="slider" id="npSeek" role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><div class="strack"><div class="sfill"></div><div class="sthumb"></div></div></div>
    <div class="times" aria-hidden="true"><span id="npElapsed">0:00</span><span id="npRemain">-0:00</span></div>
    <div class="npf-ctl">
      <button class="act" id="npShuffle" type="button" aria-label="Shuffle" aria-pressed="false"></button>
      <button class="act" id="npPrev" type="button" aria-label="Previous"></button>
      <button class="act big" id="npPlay" type="button" aria-label="Pause"></button>
      <button class="act" id="npNext" type="button" aria-label="Next"></button>
      <button class="act" id="npRepeat" type="button" aria-label="Repeat off" aria-pressed="false"></button>
    </div>
    <div class="npf-skip" id="npSkip" hidden>
      <button class="act" id="npBack15" type="button" aria-label="Back 15 seconds"></button>
      <button class="act" id="npFwd30" type="button" aria-label="Forward 30 seconds"></button>
    </div>
    <div class="npf-vol" id="npVolRow" hidden>
      <span id="npVolIcon"></span>
      <div class="slider" id="npVol" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="strack"><div class="sfill"></div><div class="sthumb"></div></div></div>
    </div>
    <button class="linkbtn npf-dev" id="npDev" type="button"></button>
    <div class="npf-opts" id="npOpts"></div>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet-panel">
    <h2 id="sheetTitle">Play on</h2>
    <ul class="devlist" id="devList"></ul>
    <div class="sheet-btns">
      <button class="btn secondary" id="sheetRefresh" type="button">Refresh</button>
      <button class="btn secondary" id="sheetClose" type="button">Close</button>
    </div>
  </div>
</div>

<div class="sheet" id="queue" role="dialog" aria-modal="true" aria-labelledby="queueTitle" hidden>
  <div class="sheet-back" id="queueBack"></div>
  <div class="sheet-panel">
    <h2 id="queueTitle">Up next</h2>
    <label class="setrow"><input type="checkbox" id="qHide"><span><span class="setname">Hide songs Spotify adds after my queue</span><span class="setnote">Shows only what you added with ＋ on this page in the last 24 hours.</span></span></label>
    <div id="qBody"></div>
    <div class="sheet-btns">
      <button class="btn secondary" id="queueRefresh" type="button">Refresh</button>
      <button class="btn secondary" id="queueClose" type="button">Close</button>
    </div>
  </div>
</div>

<div class="sheet" id="diag" role="dialog" aria-modal="true" aria-labelledby="diagTitle" hidden>
  <div class="sheet-back" id="diagBack"></div>
  <div class="sheet-panel">
    <h2 id="diagTitle">Diagnostics</h2>
    <h3 class="sheet-sub">Settings</h3>
    <fieldset class="setgroup" id="wakeModes">
      <legend>When Spotify isn’t running</legend>
      <label class="setrow"><input type="radio" name="wakeMode" value="wait"><span><span class="setname">Wait for me to press play (no app)</span><span class="setnote">Press play in Control Center or on the lock screen. Spotify starts in the background and the page plays what you tapped.</span></span></label>
      <label class="setrow"><input type="radio" name="wakeMode" value="link"><span><span class="setname">Open the Spotify app</span><span class="setnote">A tap opens the item in Spotify; switch back and the page plays it.</span></span></label>
      <label class="setrow"><input type="radio" name="wakeMode" value="shortcut"><span><span class="setname">Run my Wake Spotify shortcut</span><span class="setnote">A tap runs your “Wake Spotify” shortcut, which opens Spotify and comes back to the page.</span></span></label>
    </fieldset>
    <fieldset class="setgroup" id="themeModes">
      <legend>Appearance</legend>
      <label class="setrow"><input type="radio" name="theme" value="auto"><span><span class="setname">Match phone</span></span></label>
      <label class="setrow"><input type="radio" name="theme" value="light"><span><span class="setname">Light</span></span></label>
      <label class="setrow"><input type="radio" name="theme" value="dark"><span><span class="setname">Dark</span></span></label>
    </fieldset>
    <label class="setgroup" for="searchFirst"><span class="setname">Search Spotify: show first in All</span></label>
    <select class="field" id="searchFirst">
      <option value="track">Songs</option>
      <option value="artist">Artists</option>
      <option value="album">Albums</option>
      <option value="playlist">Playlists</option>
      <option value="show">Podcasts</option>
      <option value="episode">Episodes</option>
    </select>
    <p class="sethint">The other groups keep their usual order.</p>
    <h3 class="sheet-sub">Report</h3>
    <pre class="diagpre" id="diagOut">Checking…</pre>
    <div class="sheet-btns">
      <button class="btn secondary" id="diagCopy" type="button">Copy</button>
      <button class="btn secondary" id="diagRun" type="button">Run again</button>
      <button class="btn secondary" id="diagClose" type="button">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

      var more = el('button', { class: 'btn secondary', type: 'button', text: d.loading ? 'Loading…' : 'Load more' });
      if (d.loading) more.setAttribute('aria-disabled', 'true');
      more.addEventListener('click', function () { if (!d.loading) loadArtist(d); });
      f.appendChild(more);
      if (hadFocus) more.focus({ preventScroll: true });
      return;
    }
    if (!d.items.length) { f.appendChild(el('p', { class: 'empty', text: 'No releases here.' })); return; }
    if (hadFocus && d.lastGot && d.lastGot.length) {
      // No more: focus moves to the first release just added.
      var t = document.querySelector('#alist a.item[href="' + d.lastGot[0].url.replace(/"/g, '') + '"]');
      if (t) t.focus({ preventScroll: true });
    }
  }

  // ---------- screens ----------
  function stopApp() {
    state.started = false;
    clearTimeout(state.pollTimer); state.pollTimer = null;
    stopWake();
    state.player = null;
    state.playerIdle = false;
    clearLastPlay();   // signed out: the last playback belongs to that sign-in
    state.detail = null; state.detailStack = [];
    $('top').classList.remove('detail');
    $('top').hidden = true;
    $('banner').hidden = true;
    closeSheet();
    closeQueue(false);
    closeNp(false);
    paintPlayer();
  }
  function renderSetup(errMsgText) {
    stopApp();
    var main = $('main'); main.textContent = '';
    var input = el('input', { class: 'field', id: 'clientId', type: 'text', placeholder: 'Paste your Client ID', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Client ID' });
    var save = el('button', { class: 'btn', type: 'button', text: 'Save and sign in with Spotify' });
    var copy = el('button', { class: 'btn secondary', type: 'button', text: 'Copy this address' });
    var addr = el('div', { class: 'mono', id: 'redirect', text: REDIRECT });
    copy.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(REDIRECT).then(function () { toast('Copied'); }, function () { toast('Select the address and copy it'); });
      } else { toast('Select the address and copy it'); }
    });
    save.addEventListener('click', function () {
      var v = input.value.trim();
      if (!/^[0-9a-f]{32}$/i.test(v)) { err.textContent = 'That doesn’t look like a Client ID. It’s 32 letters and numbers, from your app’s Settings page.'; return; }
      set(K.client, v); login();
    });
    var err = el('p', { class: 'err', text: errMsgText || '' });
    main.appendChild(el('section', { class: 'card' }, [
      el('h2', { text: 'One-time setup' }),
      el('p', { text: 'In your Spotify developer app, set the Redirect URI to this exact address:' }),
      addr, copy,
      el('p', { text: 'Then paste the app’s Client ID here. It isn’t a password; it only identifies your app.' }),
      input, save, err
    ]));
  }
  function renderSignIn(msg) {
    stopApp();
    var main = $('main'); main.textContent = '';
    var go = el('button', { class: 'btn', type: 'button', text: 'Sign in with Spotify' });
    go.addEventListener('click', login);
    var reset = el('button', { class: 'btn secondary', type: 'button', text: 'Change Client ID' });
    reset.addEventListener('click', function () { del(K.client); del(K.token); renderSetup(); });
    main.appendChild(el('section', { class: 'card' }, [
      el('h2', { text: 'Sign in' }),
      el('p', { text: 'Sign in once on this phone. You’ll stay signed in until Spotify asks again (about every 6 months).' }),
      msg ? el('p', { class: 'err', text: msg }) : null,
      go, reset
    ]));
  }

  function refresh() {
    return loadData().then(function (d) {
      state.data = d;
      seedSaved(d, true);
      renderList();
      paintHearts();
    }).catch(function (e) {
      if (e.message === 'signed-out') return renderSignIn();
      if (!state.data && !state.detail && state.filter !== 'search' && state.filter !== 'recent') {
        $('main').textContent = ''; $('main').appendChild(el('p', { class: 'err', text: 'Couldn’t load your library: ' + e.message }));
      } else toast('Couldn’t refresh: ' + e.message);
    });
  }
  function startApp() {
    state.started = true;
    $('top').hidden = false;
    var f = get(K.filter);
    state.filter = FILTERS.indexOf(f) !== -1 ? f : 'home';   // Home unless you picked another filter before
    var st = get(K.searchType);
    state.stype = SEARCH_TYPES.indexOf(st) !== -1 ? st : 'all';
    paintSearchChips();
    state.data = get(K.cache);
    var lc = get(K.latest);
    state.latest.cache = (lc && Array.isArray(lc.items) && typeof lc.at === 'number') ? lc : null;
    seedSaved(state.data, false);
    updateBanner();
    setFilter(state.filter);
    checkDevice();
    refresh();
    schedulePoll(0);
    resumePending(false);
  }

  // ---------- wiring ----------
  $('search').addEventListener('input', function (e) {
    if (state.filter === 'search') scheduleSearch(e.target.value, false);
    else { state.query = e.target.value; renderList(); }
  });
  $('search').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (state.filter === 'search') scheduleSearch(e.target.value, true);
    e.target.blur(); // hides the iPhone keyboard so results are visible
  });
  document.querySelectorAll('.filters .chip').forEach(function (c) { c.addEventListener('click', function () { setFilter(c.dataset.filter, true); }); });
  document.querySelectorAll('.schip').forEach(function (c) {
    c.addEventListener('click', function () { if (c.dataset.stype !== state.stype) setSearchType(c.dataset.stype, false); });
  });
  $('refreshBtn').addEventListener('click', function () { checkDevice(); refresh(); schedulePoll(0); maybeRefreshResume(); toast('Refreshing…'); });
  $('bannerBtn').addEventListener('click', login);
  $('devBtn').addEventListener('click', openSheet);
  $('sheetClose').addEventListener('click', closeSheet);
  $('sheetBack').addEventListener('click', closeSheet);
  $('sheetRefresh').addEventListener('click', loadSheetDevices);
  // Escape closes the topmost layer only: a sheet first, then the Now Playing screen.
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('sheet').hidden) closeSheet();
    else if (!$('queue').hidden) closeQueue();
    else if (!$('diag').hidden) closeDiag();
    else closeNp();
  });
  $('pInfo').addEventListener('click', openNp);
  $('npClose').addEventListener('click', function () { closeNp(); });
  $('npDev').addEventListener('click', function () { openSheet($('npDev')); });
  $('pQueue').addEventListener('click', function () { openQueue($('pQueue')); });
  $('npQueue').addEventListener('click', function () { openQueue($('npQueue')); });
  $('queueClose').addEventListener('click', function () { closeQueue(); });
  $('queueBack').addEventListener('click', function () { closeQueue(); });
  $('queueRefresh').addEventListener('click', loadQueue);
  $('qHide').addEventListener('change', function () { set(K.queueHide, $('qHide').checked); renderQueue(); });
  document.querySelectorAll('input[name="theme"]').forEach(function (r) {
    r.addEventListener('change', function () {
      if (!r.checked) return;
      if (r.value === 'light' || r.value === 'dark') set(K.theme, r.value); else del(K.theme);
      applyTheme();
    });
  });
  $('searchFirst').addEventListener('change', function () {
    set(K.searchFirst, $('searchFirst').value);
    if (state.started && state.filter === 'search' && !state.detail) renderList();
  });
  // Swipe down from the top of the Now Playing screen closes it (not while dragging a slider).
  (function () {
    var np = $('np'), sy = null, sx = 0;
    np.addEventListener('touchstart', function (e) {
      sy = null;
      if (np.scrollTop > 0 || e.touches.length !== 1 || (e.target.closest && e.target.closest('.slider'))) return;
      sy = e.touches[0].clientY; sx = e.touches[0].clientX;
    }, { passive: true });
    np.addEventListener('touchend', function (e) {
      if (sy == null) return;
      var t = e.changedTouches[0];
      var dy = t.clientY - sy, dx = Math.abs(t.clientX - sx);
      sy = null;
      if (dy > 90 && dx < 60) closeNp(true, 'swipe down');
    }, { passive: true });
  })();
  seekSlider = makeSlider($('npSeek'), {
    max: npDuration, step: 5000,
    text: function (v) { return fmtTime(v) + ' of ' + fmtTime(npDuration()); },
    input: function (v) { paintTimes(v); },
    commit: function (v) { seekTo(v); }
  });
  volSlider = makeSlider($('npVol'), {
    max: function () { return 100; }, step: 5,
    text: function (v) { return Math.round(v) + '%'; },
    commit: function (v) { setVolume(v); }
  });
  $('diagBtn').addEventListener('click', openDiag);
  $('diagClose').addEventListener('click', closeDiag);
  $('diagBack').addEventListener('click', closeDiag);
  $('diagRun').addEventListener('click', runDiag);
  $('diagCopy').addEventListener('click', copyDiag);
  document.querySelectorAll('input[name="wakeMode"]').forEach(function (r) {
    r.addEventListener('change', function () {
      if (!r.checked) return;
      setWakeMode(r.value);
      toast(r.value === 'shortcut' ? 'Taps will run your Wake Spotify shortcut when Spotify isn’t running'
        : r.value === 'link' ? 'Taps will open the item in Spotify when Spotify isn’t running'
        : 'Taps will wait for you to press play in Control Center when Spotify isn’t running');
    });
  });
  $('wakeCancel').addEventListener('click', function () { del(K.pending); stopWake(); toast('Cancelled'); });
  $('wakeRetry').addEventListener('click', function () {
    if (!readPending()) { stopWake(); toast('Tap the item again.'); return; }
    resumePending(true);
  });
  // A real tap, so leaving for the Spotify app is allowed here.
  $('wakeOpen').addEventListener('click', function () {
    var p = readPending();
    if (!p) { stopWake(); toast('Tap the item again.'); return; }
    wakeSpotify(p.item, p.opts, 'link');
  });
  // The bar and the full Now Playing screen share the same controls.
  ['p', 'np'].forEach(function (pre) {
    $(pre + 'Prev').innerHTML = ICON.prev;
    $(pre + 'Next').innerHTML = ICON.next;
    $(pre + 'Shuffle').innerHTML = ICON.shuffle;
    $(pre + 'Play').innerHTML = ICON.pause;
    $(pre + 'Repeat').innerHTML = ICON.repeat;
    $(pre + 'Queue').innerHTML = ICON.queue;
    $(pre + 'Prev').addEventListener('click', function () { command('POST', '/me/player/previous'); });
    $(pre + 'Next').addEventListener('click', function () { command('POST', '/me/player/next'); });
    $(pre + 'Play').addEventListener('click', togglePlay);
    $(pre + 'Shuffle').addEventListener('click', toggleShuffle);
    $(pre + 'Repeat').addEventListener('click', cycleRepeat);
    $(pre + 'Heart').addEventListener('click', function () {
      var h = $(pre + 'Heart');
      toggleSave(h.getAttribute('data-uri'), h.getAttribute('data-name'), h.getAttribute('data-kind'));
    });
  });
  $('npClose').innerHTML = ICON.down;
  $('npBack15').innerHTML = ICON.back15;
  $('npFwd30').innerHTML = ICON.fwd30;
  $('npVolIcon').innerHTML = ICON.volume;
  $('npBack15').addEventListener('click', function () { seekBy(-15000); });
  $('npFwd30').addEventListener('click', function () { seekBy(30000); });
  // Back (button or swipe) closes one view per history entry: an album opened from an artist, then the artist,
  // then the list. Entries are {detail, depth}; older ones without depth count as 1.
  window.addEventListener('popstate', function () {
    var cur = state.detail ? state.detailStack.length + 1 : 0;
    var want = location.hash === '#detail' ? Math.max(1, (history.state && history.state.depth) || 1) : 0;
    if (want >= cur) {
      // Forward into a view that's gone: put the address back in step with what's on screen.
      if (want > cur) {
        try {
          if (cur) history.replaceState({ detail: true, depth: cur }, '', '#detail');
          else history.replaceState(null, '', location.pathname + location.search);
        } catch (e) {}
      }
      return;
    }
    while (state.detail && state.detailStack.length + 1 > want) closeDetail();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      clearTimeout(state.pollTimer); state.pollTimer = null;
      stopNpTick();
      if (state.wake.running) stopWake();   // pause the wake check; it starts fresh on return
      return;
    }
    if (state.started && get(K.token)) { checkDevice(); schedulePoll(0); resumePending(false); if (onLatestView() || onHome()) maybeLoadLatest(); maybeLoadHomeRecent(); maybeRefreshResume(); startNpTick(); }
  });
  // Coming back with the Back button can restore the page from memory without a visibility change.
  window.addEventListener('pageshow', function (e) {
    if (e.persisted && state.started && get(K.token)) { checkDevice(); schedulePoll(0); resumePending(false); if (onLatestView()) maybeLoadLatest(); maybeRefreshResume(); }
  });
  // Safari can report focus a moment before the visibility change; start looking for Spotify right away.
  window.addEventListener('focus', function () {
    if (state.started && get(K.token) && !document.hidden) resumePending(false);
  });

  if (location.hash === '#detail') { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  var params = new URLSearchParams(location.search);
  readPending();   // drops a pending tap older than 3 minutes
  if (params.has('wake')) {
    // The Wake Spotify shortcut opens ?wake=1; the pending tap itself is in storage.
    params.delete('wake');
    var qs = params.toString();
    try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch (e) {}
  }
  if (params.has('code') || params.has('error')) {
    handleCallback(params).then(function (ok) { if (ok) startApp(); });
  } else if (!get(K.client)) {
    renderSetup();
  } else if (!get(K.token)) {
    renderSignIn();
  } else {
    startApp();
  }
})();
</script>
</body>
</html>
